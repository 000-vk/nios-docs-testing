name: Discord Notifications

on:
  push:
    branches:
      - contents  # Adjust to your default branch (e.g., 'main' or 'master')
  pull_request:
    types: [opened, reopened, closed, edited]
    branches:
      - contents
  issues:
    types: [opened, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  release:
    types: [published]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}  # Pass webhook via environment variable
        with:
          args: |
            **Repository Notification**
            **repo name:** ${{ github.repository }}
            **Commit:** `${{ github.sha }}`
            **Commit message:** ${{ github.event.head_commit.message }}
            **Branch:** ${{ github.ref }}
            **Author:** ${{ github.event.head_commit.author.email }}
            **Repository:** ${{ github.repository }}
            **Event:** ${{ github.event_name }}
