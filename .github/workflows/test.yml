name: Discord Notifications

on:
  push:
    branches:
      - contents  # Adjust to your default branch (e.g., 'master')
  pull_request:
    types: [opened, reopened, closed, edited]
    branches:
      - contents
  issues:
    types: [opened, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  release:
    types: [published]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            {
              "embeds": [
                {
                  "title": "GitHub Event Notification",
                  "color": 3447003,  # A pleasant blue-green color
                  "fields": [
                    {
                      "name": "Repository",
                      "value": "**${{ github.repository }}**",
                      "inline": true
                    },
                    {
                      "name": "Event",
                      "value": "**${{ github.event_name }}**",
                      "inline": true
                    },
                    {
                      "name": "Action",
                      "value": "**${{ github.event.action || 'Triggered' }}**",
                      "inline": true
                    },
                    ${{ github.event_name == 'push' && format('{"name": "Commit Details", "value": "**Message:** {0}\\n**Author:** {1}\\n[View Commit]({2})", "inline": false}', github.event.head_commit.message, github.event.pusher.name, github.event.head_commit.url) || 'null' }},
                    ${{ github.event_name == 'pull_request' && format('{"name": "Pull Request Details", "value": "**Title:** {0}\\n**Author:** {1}\\n[View PR]({2})\\n**State:** {3}", "inline": false}', github.event.pull_request.title, github.event.pull_request.user.login, github.event.pull_request.html_url, github.event.pull_request.state) || 'null' }},
                    ${{ github.event_name == 'issues' && format('{"name": "Issue Details", "value": "**Title:** {0}\\n**Author:** {1}\\n[View Issue]({2})\\n**State:** {3}", "inline": false}', github.event.issue.title, github.event.issue.user.login, github.event.issue.html_url, github.event.action) || 'null' }},
                    ${{ github.event_name == 'issue_comment' && format('{"name": "Comment Details", "value": "**Issue #:** {0}\\n**Author:** {1}\\n[View Comment]({2})\\n**Comment:** {3}", "inline": false}', github.event.issue.number, github.event.comment.user.login, github.event.comment.html_url, github.event.comment.body) || 'null' }},
                    ${{ github.event_name == 'release' && format('{"name": "Release Details", "value": "**Name:** {0}\\n**Tag:** {1}\\n[View Release]({2})", "inline": false}', github.event.release.name, github.event.release.tag_name, github.event.release.html_url) || 'null' }},
                    {
                      "name": "Timestamp",
                      "value": "**${{ github.event_name == 'push' && github.event.head_commit.timestamp || github.event_name == 'pull_request' && github.event.pull_request.created_at || github.event_name == 'issues' && github.event.issue.created_at || github.event_name == 'issue_comment' && github.event.comment.created_at || github.event_name == 'release' && github.event.release.created_at || 'N/A' }} IST**",
                      "inline": false
                    }
                  ],
                  "footer": {
                    "text": "Notification via GitHub Action"
                  }
                }
              ]
            }