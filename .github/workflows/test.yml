name: Discord Notifications

on:
  push:
    branches:
      - contents      # Adjust to your default branch (e.g., 'master')
  pull_request:
    types: [opened, reopened, closed, edited]
    branches:
      - contents
  issues:
    types: [opened, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  release:
    types: [published]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            **GitHub Event Notification**

            **Repository:** `${{ github.repository }}`
            **Event:** `${{ github.event_name }}`
            **Action:** `${{ github.event.action || 'triggered' }}`

            ${{ github.event_name == 'push' && format('**Commit Message:**\n{0}\n**Author:** {1}\n[View Commit]({2})', github.event.head_commit.message, github.event.pusher.name, github.event.head_commit.url) || '' }}
            ${{ github.event_name == 'pull_request' && format('**PR Title:**\n{0}\n**Author:** {1}\n[View PR]({2})\n**State:** {3}', github.event.pull_request.title, github.event.pull_request.user.login, github.event.pull_request.html_url, github.event.pull_request.state) || '' }}
            ${{ github.event_name == 'issues' && format('**Issue Title:**\n{0}\n**Author:** {1}\n[View Issue]({2})\n**State:** {3}', github.event.issue.title, github.event.issue.user.login, github.event.issue.html_url, github.event.action) || '' }}
            ${{ github.event_name == 'issue_comment' && format('**Comment on Issue #{0}:**\n{3}\n**Author:** {1}\n[View Comment]({2})', github.event.issue.number, github.event.comment.user.login, github.event.comment.html_url, github.event.comment.body) || '' }}
            ${{ github.event_name == 'release' && format('**Release:**\n{0}\n**Tag:** {1}\n[View Release]({2})', github.event.release.name, github.event.release.tag_name, github.event.release.html_url) || '' }}

            **Timestamp:** `${{ github.event_name == 'push' && github.event.head_commit.timestamp || github.event_name == 'pull_request' && github.event.pull_request.created_at || github.event_name == 'issues' && github.event.issue.created_at || github.event_name == 'issue_comment' && github.event.comment.created_at || github.event_name == 'release' && github.event.release.created_at || '' }}`