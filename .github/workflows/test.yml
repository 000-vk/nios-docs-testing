name: Discord Notifications

on:
  push:
    branches:
      - contents        # adjust to your default branch if needed
  pull_request:
    types: [opened, reopened, closed, edited]
    branches:
      - contents
  issues:
    types: [opened, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  release:
    types: [published, created, released]

jobs:
  notify-discord:
    name: Notify Discord
    runs-on: ubuntu-latest

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      EVENT_NAME: ${{ github.event_name }}
      ACTION: ${{ github.event.action }}
      REPO: ${{ github.repository }}
      DEFAULT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
      HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      HEAD_COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
      HEAD_COMMIT_URL: ${{ github.event.head_commit.url }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_STATE: ${{ github.event.pull_request.state }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_ACTION: ${{ github.event.action }}
      COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_URL: ${{ github.event.comment.html_url }}
      RELEASE_NAME: ${{ github.event.release.name }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_URL: ${{ github.event.release.html_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build payload and send to Discord (safe JSON encoding)
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set. Skipping notification."
            exit 0
          fi

          # Build a readable message using newlines and markdown
          content="**Event:** ${EVENT_NAME}"
          if [ -n "${ACTION}" ]; then
            content="${content} — ${ACTION}"
          fi
          content="${content}\n**Repository:** ${REPO}"

          if [ -n "${HEAD_COMMIT_MESSAGE}" ]; then
            content="${content}\n\n**Commit:** ${HEAD_COMMIT_MESSAGE}"
            if [ -n "${HEAD_COMMIT_AUTHOR}" ]; then
              content="${content}\n**Author:** ${HEAD_COMMIT_AUTHOR}"
            fi
            if [ -n "${HEAD_COMMIT_URL}" ]; then
              content="${content}\n${HEAD_COMMIT_URL}"
            fi
          fi

          if [ -n "${PR_TITLE}" ]; then
            content="${content}\n\n**Pull Request:** ${PR_TITLE}"
            if [ -n "${PR_AUTHOR}" ]; then content="${content}\n**PR author:** ${PR_AUTHOR}"; fi
            if [ -n "${PR_URL}" ]; then content="${content}\n${PR_URL}"; fi
            if [ -n "${PR_STATE}" ]; then content="${content}\n**State:** ${PR_STATE}"; fi
          fi

          if [ -n "${ISSUE_TITLE}" ]; then
            content="${content}\n\n**Issue #${ISSUE_NUMBER}:** ${ISSUE_TITLE}"
            if [ -n "${ISSUE_AUTHOR}" ]; then content="${content}\n**Issue author:** ${ISSUE_AUTHOR}"; fi
            if [ -n "${ISSUE_URL}" ]; then content="${content}\n${ISSUE_URL}"; fi
            if [ -n "${ISSUE_ACTION}" ]; then content="${content}\n**Action:** ${ISSUE_ACTION}"; fi
          fi

          if [ -n "${COMMENT_BODY}" ]; then
            short_comment="${COMMENT_BODY}"
            if [ ${#short_comment} -gt 650 ]; then
              short_comment="${short_comment:0:650}…"
            fi
            content="${content}\n\n**Comment by ${COMMENT_AUTHOR}:**\n${short_comment}"
            if [ -n "${COMMENT_URL}" ]; then content="${content}\n${COMMENT_URL}"; fi
          fi

          if [ -n "${RELEASE_NAME}" ] || [ -n "${RELEASE_TAG}" ]; then
            content="${content}\n\n**Release:** ${RELEASE_NAME} ${RELEASE_TAG}"
            if [ -n "${RELEASE_URL}" ]; then content="${content}\n${RELEASE_URL}"; fi
          fi

          if [ -n "${DEFAULT_TIMESTAMP}" ]; then
            content="${content}\n\n_Timestamp: ${DEFAULT_TIMESTAMP}_"
          fi

          # Use Python to safely encode JSON (avoids double-escaping issues)
          payload=$(printf "%s" "$content" | python -c 'import sys,json; text=sys.stdin.read(); print(json.dumps({"content": text}))')

          echo "Payload to send:"
          echo "$payload"

          # Send to Discord
          curl -s -X POST -H "Content-Type: application/json" --data "$payload" "$DISCORD_WEBHOOK_URL" \
            || echo "Failed to send notification (curl exit code $?)."

