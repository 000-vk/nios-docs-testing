name: Discord Notifications

on:
  push:
    branches:
      - contents  # Adjust to your default branch (e.g., 'master')
  pull_request:
    types: [opened, reopened, closed, edited]
    branches:
      - contents
  issues:
    types: [opened, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  release:
    types: [published]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Function to construct the Discord embed payload
          constructEmbed() {
            local event_name="${{ github.event_name }}"
            local action="${{ github.event.action || 'Triggered' }}"
            local repo="${{ github.repository }}"
            local timestamp=""
            if [ "${{ github.event_name }}" = "push" ]; then
              timestamp="${{ github.event.head_commit.timestamp }}"
            elif [ "${{ github.event_name }}" = "pull_request" ]; then
              timestamp="${{ github.event.pull_request.created_at }}"
            elif [ "${{ github.event_name }}" = "issues" ]; then
              timestamp="${{ github.event.issue.created_at }}"
            elif [ "${{ github.event_name }}" = "issue_comment" ]; then
              timestamp="${{ github.event.comment.created_at }}"
            elif [ "${{ github.event_name }}" = "release" ]; then
              timestamp="${{ github.event.release.created_at }}"
            else
              timestamp="$(date -u +'%Y-%m-%dT%H:%M:%S+00:00')"
            fi
            timestamp="$(date -u -d "$timestamp" +'%Y-%m-%dT%H:%M:%S+05:30')"

            # Base embed structure
            local payload=$(cat <<EOF
            {
              "embeds": [
                {
                  "title": "GitHub Event Notification",
                  "color": 3447003,
                  "fields": [
                    {"name": "Repository", "value": "**$repo**", "inline": true},
                    {"name": "Event", "value": "**$event_name**", "inline": true},
                    {"name": "Action", "value": "**$action**", "inline": true}
                  ],
                  "footer": {"text": "Notification via GitHub Action"},
                  "timestamp": "$timestamp"
                }
              ]
            }
            EOF
            )

            # Add event-specific fields
            if [ "$event_name" = "push" ]; then
              payload=$(echo "$payload" | jq -c '.embeds[0].fields += [{"name": "Commit Details", "value": "**Message:** '${{ github.event.head_commit.message }}'\\n**Author:** ${{ github.event.pusher.name }}\\n[View Commit](${{ github.event.head_commit.url }})", "inline": false}]')
            elif [ "$event_name" = "pull_request" ]; then
              payload=$(echo "$payload" | jq -c '.embeds[0].fields += [{"name": "Pull Request Details", "value": "**Title:** ${{ github.event.pull_request.title }}\\n**Author:** ${{ github.event.pull_request.user.login }}\\n[View PR](${{ github.event.pull_request.html_url }})\\n**State:** ${{ github.event.pull_request.state }}", "inline": false}]')
            elif [ "$event_name" = "issues" ]; then
              payload=$(echo "$payload" | jq -c '.embeds[0].fields += [{"name": "Issue Details", "value": "**Title:** ${{ github.event.issue.title }}\\n**Author:** ${{ github.event.issue.user.login }}\\n[View Issue](${{ github.event.issue.html_url }})\\n**State:** $action", "inline": false}]')
            elif [ "$event_name" = "issue_comment" ]; then
              payload=$(echo "$payload" | jq -c '.embeds[0].fields += [{"name": "Comment Details", "value": "**Issue #:** ${{ github.event.issue.number }}\\n**Author:** ${{ github.event.comment.user.login }}\\n[View Comment](${{ github.event.comment.html_url }})\\n**Comment:** ${{ github.event.comment.body }}", "inline": false}]')
            elif [ "$event_name" = "release" ]; then
              payload=$(echo "$payload" | jq -c '.embeds[0].fields += [{"name": "Release Details", "value": "**Name:** ${{ github.event.release.name }}\\n**Tag:** ${{ github.event.release.tag_name }}\\n[View Release](${{ github.event.release.html_url }})", "inline": false}]')
            fi

            echo "$payload"
          }

          # Send the notification to Discord
          payload=$(constructEmbed)
          curl -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"